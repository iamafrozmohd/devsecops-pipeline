# Checkov configuration. Every skipped check has a written justification:
# a skip is a documented risk decision, not a way to make the pipeline green.
compact: true
quiet: true
skip-check:
  # Customer-managed keys: Microsoft-managed keys plus infrastructure (double) encryption
  # are enabled. CMK adds Key Vault and key-rotation overhead that this demo doesn't need.
  - CKV2_AZURE_1
  # Private endpoint: public network access is disabled outright. In a real deployment the
  # private endpoint would live in the shared networking module, not this storage module.
  - CKV2_AZURE_33
  # Queue service logging: this account stores blobs only and has no queues.
  - CKV_AZURE_33
  # Blob read logging: this policy only recognises the legacy Storage Insights method, which
  # needs a shared access key, and shared keys are disabled on purpose. Blob read, write and
  # delete logging is implemented instead with a diagnostic setting that sends StorageRead,
  # StorageWrite and StorageDelete logs to Log Analytics (see azurerm_monitor_diagnostic_setting).
  - CKV2_AZURE_21
